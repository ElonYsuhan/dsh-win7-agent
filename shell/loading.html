<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 桌面壳（macOS）的顶栏拖拽带：整条窗口顶边都能按住拖窗口。
       默认 display:none，只有 <html> 带 .shell-mac 时才出现（见 style.css）。 -->
  <div id="titlebarDrag" class="titlebar-drag" aria-hidden="true"></div>
  <div class="card">
    <h1>Agent</h1>
    <p class="muted" id="hint">正在启动本地服务，请稍候…</p>

    <div class="steps" id="steps">
      <div class="step" data-step="probe"><span class="dot"></span><span class="step-text">检查可用端口</span></div>
      <div class="step" data-step="spawn"><span class="dot"></span><span class="step-text">启动本地 agent 服务</span></div>
      <div class="step" data-step="ready"><span class="dot"></span><span class="step-text">打开聊天界面</span></div>
    </div>

    <div class="url hidden" id="detail"></div>

    <div class="actions hidden" id="actions">
      <button id="retry" class="primary">重试</button>
      <button id="settings">服务设置</button>
    </div>

    <div id="status" class="status"></div>
  </div>
  <script src="loading.js"></script>
</body>
</html>
