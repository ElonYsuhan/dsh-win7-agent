<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="titlebarDrag" class="titlebar-drag" aria-label="窗口标题栏">
    <span class="titlebar-app-name">Agent</span>
    <span class="titlebar-divider" aria-hidden="true"></span>
    <span id="windowTitle" class="window-title">正在加载</span>
  </header>
  <main class="shell-content">
  <div class="card">
    <h1>Agent</h1>
    <p class="muted" id="hint">正在加载…</p>

    <div class="steps hidden" id="steps">
      <div class="step" data-step="probe"><span class="dot"></span><span class="step-text">检查可用端口</span></div>
      <div class="step" data-step="spawn"><span class="dot"></span><span class="step-text">启动本地 agent 服务</span></div>
      <div class="step" data-step="ready"><span class="dot"></span><span class="step-text">打开聊天界面</span></div>
    </div>

    <div class="url hidden" id="detail"></div>

    <div class="actions hidden" id="actions">
      <button id="retry" class="primary">重试</button>
      <button id="settings">服务设置</button>
    </div>

    <div id="status" class="status"></div>
  </div>
  </main>
  <script src="loading.js"></script>
</body>
</html>
