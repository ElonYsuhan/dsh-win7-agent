<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>服务连接失败</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="titlebarDrag" class="titlebar-drag" aria-label="窗口标题栏">
    <span class="titlebar-app-name">Agent</span>
    <span class="titlebar-divider" aria-hidden="true"></span>
    <span id="windowTitle" class="window-title">连接失败</span>
  </header>
  <main class="shell-content">
  <div class="card">
    <h1>服务连接失败</h1>
    <p class="muted">当前配置的 agent 服务没有响应。</p>
    <div class="url" id="serviceUrl"></div>
    <div class="actions">
      <button id="retry" class="primary">重试</button>
      <button id="settings">服务设置</button>
    </div>
    <div id="status" class="status"></div>
  </div>
  </main>
  <script src="offline.js"></script>
</body>
</html>
